<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Calculator & Planner — AC ADEXA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="navbar">
    <div class="app-container navbar-container" id="navbar-container"></div>
  </header>

  <main class="main-content">
    <div class="app-container">
      <div class="mb-4">
        <h1 class="text-2xl font-bold">Attendance Calculator & Planner</h1>
        <p class="text-sm text-muted">Calculate your current attendance percentage and plan upcoming class attendance.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Calculator Form -->
        <div>
          <div class="card mb-4">
            <h2 class="card-title mb-3">📊 Attendance Calculator</h2>
            <form id="att-calc-form">
              <div class="form-group">
                <label class="form-label">Total Classes Conducted *</label>
                <input type="number" id="att-conducted" class="form-control" min="1" placeholder="e.g. 60" required />
              </div>
              <div class="form-group">
                <label class="form-label">Total Classes Attended *</label>
                <input type="number" id="att-attended" class="form-control" min="0" placeholder="e.g. 48" required />
              </div>
            </form>
          </div>

          <div id="att-result-container">
            <!-- Dynamic Result Card -->
          </div>
        </div>

        <!-- Attendance Planner Form -->
        <div>
          <div class="card mb-4">
            <h2 class="card-title mb-3">🎯 Upcoming Attendance Planner</h2>
            <form id="att-planner-form">
              <div class="form-group">
                <label class="form-label">Upcoming Classes Scheduled *</label>
                <input type="number" id="planner-upcoming" class="form-control" min="1" placeholder="e.g. 20" required />
              </div>
              <div class="form-group">
                <label class="form-label">Target Attendance Percentage (%)</label>
                <input type="number" id="planner-target" class="form-control" min="50" max="100" value="75" required />
              </div>
            </form>
          </div>

          <div id="planner-result-container">
            <!-- Dynamic Planner Card -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-nav-bar" id="mobile-nav-bar"></nav>

  <script src="js/data/regulations.js"></script>
  <script src="js/core/attendance.js"></script>
  <script src="js/features/storage.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/regulation-selector.js"></script>
  <script src="js/components/result-card.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/feedback.js"></script>
  <script src="js/pages/attendance.js"></script>
</body>
</html>
