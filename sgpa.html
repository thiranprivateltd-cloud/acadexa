<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGPA Calculator — AC ADEXA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="navbar">
    <div class="app-container navbar-container" id="navbar-container"></div>
  </header>

  <main class="main-content">
    <div class="app-container">
      <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <div>
          <h1 class="text-2xl font-bold">SGPA Calculator</h1>
          <p class="text-sm text-muted">Calculate & save your Semester Grade Point Average separately for each semester.</p>
        </div>
        <div class="flex gap-2 items-center flex-wrap">
          <button id="add-sem-tab-btn" class="btn btn-secondary">
            📁 + Add Semester
          </button>
          <button id="add-course-btn" class="btn btn-primary">
            + Add Course
          </button>
        </div>
      </div>

      <!-- Semester Tabs / Bar -->
      <div class="card mb-4 p-3 bg-surface">
        <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
          <span class="text-xs font-bold uppercase text-muted" style="letter-spacing: 0.5px;">Select Semester</span>
          <div class="flex items-center gap-2">
            <span id="active-sem-badge" class="status-badge info text-xs">Viewing Semester 1</span>
            <button id="delete-curr-sem-btn" class="btn btn-sm btn-outline" style="color: #ef4444; border-color: #ef4444; padding: 0.2rem 0.6rem; font-size: 0.75rem;" title="Delete this semester's courses and SGPA record">
              🗑️ Delete Semester
            </button>
          </div>
        </div>
        <div id="sem-tabs-bar" class="flex gap-2 flex-wrap items-center">
          <!-- Dynamic Semester Tabs -->
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Course Entry Rows -->
        <div>
          <div class="flex justify-between items-center mb-3">
            <h2 id="sem-heading" class="text-lg font-bold">Semester 1 Courses</h2>
            <span id="course-count-badge" class="text-xs text-muted">0 courses</span>
          </div>
          <div id="course-list-container">
            <!-- Dynamic course rows -->
          </div>
        </div>

        <!-- Result Card & Analytics -->
        <div>
          <div id="sgpa-result-container">
            <!-- Dynamic SGPA Hero Card -->
          </div>

          <div class="card mt-4">
            <h3 class="card-title mb-3">📊 Grade Distribution</h3>
            <div id="grade-chart-container" style="height: 220px;">
              <!-- SVG Bar Chart -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-nav-bar" id="mobile-nav-bar"></nav>

  <script src="js/data/regulations.js"></script>
  <script src="js/core/grading.js"></script>
  <script src="js/core/sgpa.js"></script>
  <script src="js/features/storage.js"></script>
  <script src="js/features/charts.js"></script>
  <script src="js/features/sharing.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/regulation-selector.js"></script>
  <script src="js/components/course-card.js"></script>
  <script src="js/components/result-card.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/feedback.js"></script>
  <script src="js/pages/sgpa.js"></script>
</body>
</html>
