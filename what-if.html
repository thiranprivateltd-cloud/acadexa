<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What-If Academic Simulator — AC ADEXA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="navbar">
    <div class="app-container navbar-container" id="navbar-container"></div>
  </header>

  <main class="main-content">
    <div class="app-container">
      <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="text-2xl font-bold">What-If Academic Simulator</h1>
          <p class="text-sm text-muted">Simulate potential grade improvements in sandbox mode without altering your saved records.</p>
        </div>
        <div class="flex gap-2">
          <button id="whatif-reset-btn" class="btn btn-secondary btn-sm">Reset Simulation</button>
          <button id="whatif-apply-btn" class="btn btn-primary btn-sm">Apply to Saved Data</button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Course Sandbox Inputs -->
        <div>
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold">Sandbox Courses</h2>
            <button id="whatif-add-course-btn" class="btn btn-sm btn-outline">+ Add Course</button>
          </div>
          <div id="whatif-course-list">
            <!-- Dynamic Sandbox Course Rows -->
          </div>
        </div>

        <!-- Simulation Result & Impact Summary -->
        <div>
          <div id="whatif-result-container">
            <!-- Dynamic Summary Card -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-nav-bar" id="mobile-nav-bar"></nav>

  <script src="js/data/regulations.js"></script>
  <script src="js/core/grading.js"></script>
  <script src="js/core/sgpa.js"></script>
  <script src="js/features/storage.js"></script>
  <script src="js/features/whatif.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/regulation-selector.js"></script>
  <script src="js/components/result-card.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/feedback.js"></script>
  <script src="js/pages/what-if.js"></script>
</body>
</html>
