<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Insights & Trends — Acadexa</title>
  <meta name="description" content="Transparent, rule-based analytics of semester performance, grade distributions, and trends." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <div class="app-main-wrapper">
      <div id="topbar-container"></div>

      <main class="main-content">
        <div class="app-container">
          <div class="mb-6">
            <h1 class="text-2xl font-bold mb-1">Academic Insights & Trends</h1>
            <p class="text-sm text-secondary">Transparent, rule-based analysis of semester trajectory, grade distribution curves, and academic standing.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- Grade Distribution Chart -->
            <div class="card">
              <h2 class="card-title mb-3">Grade Distribution</h2>
              <div id="insights-grade-chart" style="height: 220px;">
                <!-- SVG Bar Chart -->
              </div>
            </div>

            <!-- SGPA Trend Chart -->
            <div class="card">
              <h2 class="card-title mb-3">SGPA Semester Trend</h2>
              <div id="insights-trend-chart" style="height: 220px;">
                <!-- SVG Line Chart -->
              </div>
              <p id="insights-trend-text" class="text-xs text-muted text-center mt-2 font-medium"></p>
            </div>
          </div>

          <!-- Rule-based Insights Cards -->
          <section class="card">
            <h2 class="card-title mb-4">Rule-Based Performance Insights</h2>
            <div id="rule-insights-container">
              <!-- Dynamic rule cards -->
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <nav class="mobile-nav-bar" id="mobile-nav-bar"></nav>

  <script src="js/data/regulations.js"></script>
  <script src="js/core/grading.js"></script>
  <script src="js/core/attendance.js"></script>
  <script src="js/core/sgpa.js"></script>
  <script src="js/core/cgpa.js"></script>
  <script src="js/features/storage.js"></script>
  <script src="js/features/charts.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/regulation-selector.js"></script>
  <script src="js/components/result-card.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/feedback.js"></script>
  <script src="js/pages/insights.js"></script>
</body>
</html>
